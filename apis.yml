name: Downstream
description: 'Downstream Impact Inc. was a Seattle-based SaaS platform that helped brands optimize and
  automate their Amazon advertising, founded in late 2017 by ex-Amazon marketer Connor Folley and
  ex-AWS engineer Salim Hamed. A Techstars Seattle graduate, Downstream was acquired by Amazon-analytics
  company Jungle Scout in March 2021 and its capabilities were folded into Jungle Scout''s advertising
  products. The standalone downstreamimpact.com web application is no longer served (returns 404),
  though the domain and Google Workspace email infrastructure remain active. Downstream published no
  public developer API, OpenAPI specification, or first-party SDK; its GitHub organization contains only
  archived internal tooling and forks. This profile is retained as a network company record.'
